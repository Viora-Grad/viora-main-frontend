<p-toast />
<div class="min-h-screen flex items-center justify-center p-4 bg-gray-50/50">
	<div class="w-full max-w-lg">
		<!-- Header -->
		<div class="mb-8">
			<p class="text-[11px] font-bold text-gray-400 tracking-[0.15em] uppercase mb-3">Onboarding</p>
			<div class="flex items-center justify-between">
				<h1 class="text-[32px] font-extrabold text-[#201335] tracking-tight">Create Account</h1>
				<span class="text-[13px] font-semibold text-gray-400">
					Step {{ registerStore.currentStep() }} of {{ registerStore.totalSteps() }}
				</span>
			</div>
			<!-- Progress Bar -->
			<div class="mt-4 h-1 w-full bg-gray-200 rounded-full overflow-hidden">
				<div
					class="h-full bg-[#201335] rounded-full transition-all duration-500 ease-in-out"
					[class.w-1/4]="registerStore.currentStep() === 1"
					[class.w-1/2]="registerStore.currentStep() === 2"
					[class.w-3/4]="registerStore.currentStep() === 3"
					[class.w-full]="registerStore.currentStep() === 4"
				></div>
			</div>
		</div>

		<!-- Card -->
		<div
			class="bg-white rounded-3xl p-8 sm:p-10 shadow-[0_2px_40px_rgba(0,0,0,0.04)] border border-gray-100"
		>
			@switch (registerStore.currentStep()) {
				@case (1) {
					<app-register-step-one-section />
				}
				@case (2) {
					<app-register-step-two-section />
				}
				@case (3) {
					<app-register-step-three-section />
				}
				@case (4) {
					<app-register-step-four-section />
				}
			}
		</div>

		<!-- Footer Badges -->
		<!-- <div class="flex items-center justify-center gap-3 mt-8">
			<div class="flex items-center gap-2 text-[11px] font-bold text-gray-400 tracking-wider uppercase">
				<i class="pi pi-lock text-sm"></i>
				Secure Encryption
			</div>
			<span class="text-gray-300">&middot;</span>
			<div class="flex items-center gap-2 text-[11px] font-bold text-gray-400 tracking-wider uppercase">
				<i class="pi pi-shield text-sm"></i>
				HIPAA Compliant
			</div>
		</div> -->
	</div>
</div>
