<div class="min-h-screen flex items-center justify-center p-4 bg-gray-50/50">
	<div
		class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 shadow-[0_2px_40px_rgba(0,0,0,0.04)] border border-gray-100"
	>
		<!-- Header -->
		<div class="text-center mb-8">
			<h1 class="text-[32px] font-extrabold text-[#201335] tracking-tight mb-2">Welcome Back</h1>
			<p class="text-gray-500 font-medium text-[15px]">
				Please enter your account credentials to proceed.
			</p>
		</div>

		<!-- Single Sign On -->
		<app-google-button />

		<!-- Divider -->
		<div class="flex items-center my-8">
			<div class="flex-grow border-t border-gray-100"></div>
			<span class="px-4 text-[11px] font-bold text-gray-400 tracking-wider">OR</span>
			<div class="flex-grow border-t border-gray-100"></div>
		</div>

		<!-- Form -->
		<form class="space-y-5" onsubmit="event.preventDefault()">
			<!-- Email Input -->
			<div class="space-y-1.5">
				<label
					class="block text-[11px] font-extrabold text-gray-600 tracking-wider"
					for="email-input"
					>EMAIL</label
				>
				<p-iconfield class="w-full relative block">
					<p-inputicon class="pi pi-envelope" />
					<input
						id="email-input"
						type="email"
						pInputText
						placeholder="dr.smith@viora.com"
						class="w-full bg-[#FCF8FB] border border-transparent focus:border-purple-200 focus:bg-white focus:ring-2 focus:ring-purple-100 placeholder:text-gray-300 rounded-xl py-3.5 pl-11 pr-4 text-[15px] text-gray-700 font-medium outline-none transition-all"
					/>
				</p-iconfield>
			</div>

			<!-- Password Input -->
			<div class="space-y-1.5 pt-1">
				<div class="flex justify-between items-center">
					<label
						class="block text-[11px] font-extrabold text-gray-600 tracking-wider"
						for="password-input"
						>PASSWORD</label
					>
					<a
						routerLink=""
						class="text-[12px] font-bold text-gray-500 hover:text-[#201335] transition-colors"
						>Forgot Password?</a
					>
				</div>
				<p-iconfield class="w-full relative block">
					<p-inputicon class="pi pi-lock" />
					<p-password
						id="password-input"
						name="password"
						[toggleMask]="true"
						[feedback]="false"
						class="w-full"
						inputStyleClass="w-full bg-[#FCF8FB] border border-transparent focus:border-purple-200 focus:bg-white focus:ring-2 focus:ring-purple-100 placeholder:text-gray-300 rounded-xl py-3.5 pl-11 pr-4 text-[15px] text-gray-700 font-medium outline-none transition-all"
					/>
				</p-iconfield>
			</div>

			<!-- Checkbox -->
			<div class="flex items-center pt-2 pb-4">
				<p-checkbox [binary]="true" id="checkbox-input" name="remember" />
				<label
					class="ml-3 text-[14px] font-medium text-gray-500 cursor-pointer select-none"
					for="checkbox-input"
				>
					Stay signed in for 30 days
				</label>
			</div>

			<!-- Submit Button -->
			<p-button
				type="submit"
				label="Sign In to Viora"
				[size]="'large'"
				[rounded]="false"
				[raised]="true"
				styleClass="w-full !bg-primary !border-primary hover:!bg-primary-700"
			/>
		</form>
	</div>
</div>
