<div class="grid gap-6 sm:grid-cols-1 lg:grid-cols-3 xl:grid-cols-3">
  @for (feature of features; track feature.title) {
    <p-card class="rounded-2xl shadow-sm border border-gray-200 hover:shadow-xl transition duration-300 p-5">

      <ng-template pTemplate="header">
        <div class="text-xl font-semibold">
          {{ feature.title }}
        </div>
      </ng-template>

      <div class="flex flex-col gap-2">
        <p class="text-gray-600">
          {{ feature.description }}
        </p>

        <div class="text-sm text-gray-400">
          {{ feature.useCase }}
        </div>

        <div class="mt-2 text-sm font-medium text-green-600">
          ✓ {{ feature.benefit }}
        </div>
      </div>

    </p-card>
  }
</div>
