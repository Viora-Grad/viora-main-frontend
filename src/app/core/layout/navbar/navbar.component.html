<div [ngClass]="isScrolled() ? 'navbar-scrolled' : 'navbar-transparent'">
	<div class="card">
		<p-menubar [model]="items">
			<ng-template pTemplate="start">
				<div class="flex items-center gap-2 px-2">
					<!-- Viora Logo -->
					<span class="text-xl font-bold tracking-tight"><a href="/">Viora</a></span>
				</div>
			</ng-template>

			<ng-template pTemplate="end">
				<div class="flex items-center">
					@if (authStore.isAuthenticated()) {
						<span class="text-sm font-medium text-gray-700 mr-3">
							{{ authStore.currentUser()?.firstName }}
						</span>
						<p-button
							type="button"
							label="Logout"
							severity="secondary"
							(click)="onLogout()"
						/>
					} @else {
						<p-button type="button" label="Get Started" severity="contrast" routerLink="/auth/login" />
						<p-button type="button" label="Login" severity="secondary" class="mx-3" routerLink="/auth/login" />
					}
				</div>
			</ng-template>
		</p-menubar>
	</div>
</div>
